name = "deutsch-reader-push"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Hourly check; each device gets a nudge at its own chosen local hour
[triggers]
crons = ["0 * * * *"]

[vars]
VAPID_PUBLIC = "BOfLPCjXylsvmyx0FXbtuajbnS1XobXkBbWL0r0ln5JTJqfGEjiUED3TWilSzxJ3QK9QB-GKJGjlDVJKtWqlh7E"

# The KV id is filled in after `wrangler kv namespace create SUBS`
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_ID"
